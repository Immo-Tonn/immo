server {
    listen 80;
    server_name immo-tonn.de www.immo-tonn.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name immo-tonn.de www.immo-tonn.de;

    ssl_certificate /etc/letsencrypt/live/immo-tonn.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immo-tonn.de/privkey.pem;

    location / {
        proxy_pass http://my-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://my-backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 100M;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
}
